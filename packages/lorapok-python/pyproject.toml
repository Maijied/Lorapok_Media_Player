[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lorapok"
version = "2.0.0"
description = "Lorapok Media Player Python SDK & CLI Stream Controller"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Lorapok Labs", email = "labs@lorapok.tech" }
]
dependencies = [
    "requests>=2.25.0",
    "click>=8.0.0"
]

[project.scripts]
lorapok = "lorapok.cli:main"
