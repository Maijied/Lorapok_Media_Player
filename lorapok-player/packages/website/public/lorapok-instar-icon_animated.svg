<svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="iconBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F3FF">
        <animate attributeName="stop-color" values="#00F3FF;#BC13FE;#00F3FF" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#BC13FE">
        <animate attributeName="stop-color" values="#BC13FE;#39FF14;#BC13FE" dur="4s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2f38" />
      <stop offset="50%" stop-color="#141820" />
      <stop offset="100%" stop-color="#3d4450" />
    </linearGradient>

    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#39FF14" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#00F3FF" stop-opacity="0.6" />
    </linearGradient>

    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#39FF14" />
      <stop offset="100%" stop-color="#00F3FF" stop-opacity="0" />
    </radialGradient>

    <filter id="neonBloom" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes spinCW {
      from { transform: rotate(0deg); transform-origin: 256px 256px; }
      to { transform: rotate(360deg); transform-origin: 256px 256px; }
    }
    @keyframes spinCCW {
      from { transform: rotate(360deg); transform-origin: 256px 256px; }
      to { transform: rotate(0deg); transform-origin: 256px 256px; }
    }
    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }
    .ring-outer { animation: spinCW 18s linear infinite; }
    .ring-inner { animation: spinCCW 10s linear infinite; }
    .larva-core { animation: breathe 3.2s ease-in-out infinite; transform-origin: 256px 268px; }
  </style>

  <!-- Transparent icon  animated border only, no fill background -->
  <rect
    x="24" y="24" width="464" height="464" rx="96"
    stroke="url(#iconBorderGrad)" stroke-width="4" fill="none" opacity="0.85"
  >
    <animate attributeName="stroke-opacity" values="0.55;1;0.55" dur="3s" repeatCount="indefinite" />
  </rect>

  <circle class="ring-outer" cx="256" cy="256" r="198" stroke="url(#iconBorderGrad)" stroke-width="1" stroke-dasharray="8 18" opacity="0.35" />
  <circle class="ring-inner" cx="256" cy="256" r="168" stroke="#00F3FF" stroke-width="0.8" stroke-dasharray="3 12" opacity="0.25" />

  <!-- Play glyph accents -->
  <polygon points="118,256 108,246 108,266" fill="#00F3FF" opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2.5s" repeatCount="indefinite" />
  </polygon>
  <polygon points="394,256 404,246 404,266" fill="#BC13FE" opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2.5s" repeatCount="indefinite" />
  </polygon>

  <!-- Hex frame -->
  <polygon
    points="256,108 358,158 358,282 256,332 142,282 142,158"
    stroke="url(#iconBorderGrad)" stroke-width="2" fill="none" opacity="0.6"
  />

  <g class="larva-core" filter="url(#neonBloom)">
    <ellipse cx="310" cy="290" rx="34" ry="26" fill="url(#metalGrad)" />
    <ellipse cx="310" cy="290" rx="24" ry="17" fill="url(#panelGrad)" opacity="0.65">
      <animate attributeName="opacity" values="0.45;0.85;0.45" dur="2s" repeatCount="indefinite" />
    </ellipse>

    <ellipse cx="268" cy="278" rx="36" ry="28" fill="url(#metalGrad)" />
    <ellipse cx="268" cy="278" rx="26" ry="19" fill="url(#panelGrad)" opacity="0.6">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2.2s" repeatCount="indefinite" />
    </ellipse>

    <ellipse cx="228" cy="262" rx="34" ry="28" fill="url(#metalGrad)" />
    <ellipse cx="228" cy="262" rx="24" ry="18" fill="url(#panelGrad)" opacity="0.55">
      <animate attributeName="opacity" values="0.35;0.75;0.35" dur="2.4s" repeatCount="indefinite" />
    </ellipse>

    <g transform="translate(268,278)">
      <circle r="7" fill="none" stroke="#39FF14" stroke-width="1.2" opacity="0.75">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5s" repeatCount="indefinite" />
      </circle>
    </g>

    <ellipse cx="192" cy="242" rx="44" ry="36" fill="url(#metalGrad)" />
    <circle cx="172" cy="232" r="15" fill="url(#eyeGlow)" filter="url(#softGlow)">
      <animate attributeName="r" values="13;17;13" dur="2.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="208" cy="232" r="15" fill="url(#eyeGlow)" filter="url(#softGlow)">
      <animate attributeName="r" values="13;17;13" dur="2.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="172" cy="232" r="6" fill="#FFFFFF" />
    <circle cx="208" cy="232" r="6" fill="#FFFFFF" />

    <g stroke="#141820" stroke-width="2.5" stroke-linecap="round">
      <line x1="200" y1="278" x2="192" y2="296" />
      <line x1="224" y1="286" x2="218" y2="304" />
      <line x1="252" y1="292" x2="246" y2="310" />
      <line x1="280" y1="296" x2="274" y2="314" />
    </g>
  </g>

  <!-- Corner HUD nodes -->
  <circle cx="256" cy="88" r="5" fill="#00F3FF" filter="url(#softGlow)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.6s" repeatCount="indefinite" />
  </circle>
  <circle cx="256" cy="400" r="5" fill="#BC13FE" filter="url(#softGlow)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.6s" repeatCount="indefinite" />
  </circle>
</svg>
