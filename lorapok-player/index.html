<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Lorapok Player</title>
    <style>
      body { margin: 0; background: #050510; overflow: hidden; }
      #loading-screen {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #050510;
        transition: opacity 0.6s ease, visibility 0.6s ease;
      }
      #loading-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
      .loader-ring {
        width: 120px; height: 120px; border-radius: 50%;
        border: 3px solid transparent;
        border-top-color: #00F3FF; border-bottom-color: #BC13FE;
        animation: spin 1.5s linear infinite;
      }
      .loader-ring-inner {
        width: 90px; height: 90px; border-radius: 50%;
        border: 2px solid transparent;
        border-left-color: #BC13FE; border-right-color: #00F3FF;
        animation: spin 2s linear infinite reverse;
        margin: 12px auto 0;
        position: relative; top: -106px;
      }
      .loader-text {
        color: #00F3FF; font-family: sans-serif;
        font-size: 12px; letter-spacing: 6px; text-transform: uppercase;
        margin-top: -60px; opacity: 0.7;
        animation: pulse-text 2s ease-in-out infinite;
      }
      .loader-brand {
        color: rgba(255,255,255,0.3); font-family: sans-serif;
        font-size: 10px; letter-spacing: 3px; margin-top: 16px;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes pulse-text { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
    </style>
  </head>
  <body>
    <div id="loading-screen">
      <div class="loader-ring"></div>
      <div class="loader-ring-inner"></div>
      <div class="loader-text">Loading</div>
      <div class="loader-brand">LORAPOK LABS</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
