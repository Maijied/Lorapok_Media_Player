name: Deploy Website Pages

on:
  push:
    branches: [ main, master ]
    paths:
      - 'lorapok-player/packages/website/**'
      - 'lorapok-player/packages/lorapok-player/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'lorapok-player/package-lock.json'

      - name: Install Dependencies
        run: |
          npm ci --prefix lorapok-player

      - name: Build Core Library & Website
        run: |
          npm --prefix lorapok-player/packages/lorapok-player run build
          npm --prefix lorapok-player/packages/website run build

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'lorapok-player/packages/website/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
