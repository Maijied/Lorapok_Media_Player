name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'lorapok-player/package-lock.json'

      - name: Install Root Dependencies
        run: |
          npm ci --prefix lorapok-player

      - name: TypeScript Typecheck
        run: |
          npm --prefix lorapok-player run typecheck

      - name: Run Test Suites
        run: |
          npm --prefix lorapok-player run test

      - name: Build Core Library & Web Package
        run: |
          npm --prefix lorapok-player/packages/lorapok-player run build
          npm --prefix lorapok-player/packages/website run build
