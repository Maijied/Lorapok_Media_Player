name: Lorapok Enterprise CI/CD

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Security & Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Dependencies
        working-directory: lorapok-player
        run: npm install

      - name: Typecheck
        working-directory: lorapok-player
        run: npm run typecheck

  build-extensions:
    name: Build Browser Extensions (Firefox AMO, Chrome, Edge)
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Package All Browser Extensions
        working-directory: lorapok-extension
        run: |
          sudo apt-get update && sudo apt-get install -y zip
          node build_extensions.js

      - name: Store Extension Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Binaries-Extensions
          path: |
            lorapok-player/release/builds/extensions/*.xpi
            lorapok-player/release/builds/extensions/*.zip

  build-desktop:
    name: Build Desktop (${{ matrix.os }})
    needs: quality-gate
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Dependencies
        working-directory: lorapok-player
        run: npm install

      - name: Build Electron App
        working-directory: lorapok-player
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Store Binaries
        uses: actions/upload-artifact@v4
        with:
          name: Binaries-${{ matrix.os }}
          path: |
            lorapok-player/release/**/*.exe
            lorapok-player/release/**/*.dmg
            lorapok-player/release/**/*.AppImage
            lorapok-player/release/**/*.deb
            lorapok-player/release/**/*.snap
            lorapok-player/release/**/*.zip

  build-android:
    name: Build Android (Signed Release)
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Dependencies
        working-directory: lorapok-player
        run: npm install

      - name: Build Web Assets & Sync Capacitor
        working-directory: lorapok-player
        run: |
          npm run build:only
          npx cap sync android

      - name: Decode Keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -di > lorapok-player/android/app/lorapok-release.jks
          echo "ANDROID_KEYSTORE_FILE=$(pwd)/lorapok-player/android/app/lorapok-release.jks" >> $GITHUB_ENV

      - name: Set Signing Env
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "ANDROID_KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
          echo "ANDROID_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV

      - name: Make gradlew executable
        working-directory: lorapok-player/android
        run: chmod +x ./gradlew

      - name: Build Release APK & AAB
        working-directory: lorapok-player/android
        run: ./gradlew assembleRelease bundleRelease

      - name: Package Android Artifacts
        working-directory: lorapok-player
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p release/builds/android
          for apk in android/app/build/outputs/apk/release/*.apk; do
            if [ -f "$apk" ]; then
              base=$(basename "$apk")
              cp "$apk" "release/builds/android/LorapokPlayer-v${VERSION}-${base}"
            fi
          done
          AAB=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -n1)
          if [ -n "$AAB" ]; then
            cp "$AAB" "release/builds/android/LorapokPlayer-v${VERSION}-release.aab"
          fi

      - name: Store Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Binaries-Android
          path: |
            lorapok-player/release/builds/android/*.apk
            lorapok-player/release/builds/android/*.aab

  release-rolling:
    name: Update Rolling Release
    needs: [build-desktop, build-android, build-extensions]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Create/Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          name: ${{ github.ref_type == 'tag' && format('Lorapok Player {0}', github.ref_name) || 'Lorapok Player (Latest Build)' }}
          body: |
            ## Lorapok Media Player v1.5.0
            
            ${{ github.ref_type == 'tag' && format('Official stable release {0}.', github.ref_name) || '🚀 Rolling release — latest build from main branch.' }}
            
            ### Downloads & Packages
            | Platform | File Format / Target |
            |----------|----------------------|
            | 🪟 Windows | `LorapokMediaPlayer-Windows-Setup.exe` (Setup & Portable) |
            | 🍎 macOS | `Lorapok-Media-Player-1.5.0-arm64.dmg` / Intel DMG / Portable ZIP |
            | 🐧 Linux | `LorapokMediaPlayer-Linux.AppImage` (Portable) / `.deb` (Installable) |
            | 🤖 Android | Universal APK / ARM64 APK / Google Play AAB |
            | 🦊 Firefox AMO | `lorapok-extension-firefox-1.5.0.xpi` (Installable) / `.zip` |
            | 🌐 Chrome / Edge | `lorapok-extension-chrome-1.5.0.zip` / `lorapok-extension-edge-1.5.0.zip` |
            
            Website: https://media.lorapok.tech
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.snap
            artifacts/**/*.zip
            artifacts/**/*.apk
            artifacts/**/*.aab
            artifacts/**/*.xpi
          make_latest: ${{ github.ref_type == 'tag' && 'true' || 'false' }}
          prerelease: ${{ github.ref_type != 'tag' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-site:
    name: Build & Deploy Website
    needs: release-rolling
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Dependencies
        working-directory: lorapok-player
        run: npm install

      - name: Build Library
        working-directory: lorapok-player/packages/lorapok-player
        run: npm run build

      - name: Package Extensions for Website
        working-directory: lorapok-extension
        run: |
          sudo apt-get update && sudo apt-get install -y zip
          node build_extensions.js

      - name: Generate Demos & Build Website
        working-directory: lorapok-player/packages/website
        run: |
          sudo apt-get install -y ffmpeg
          node scripts/sync_downloads.js
          npm run build

      - name: Ensure Custom Domain CNAME
        working-directory: lorapok-player/packages/website
        run: |
          echo "media.lorapok.tech" > dist/CNAME

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './lorapok-player/packages/website/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  publish-package:
    name: Publish to NPM
    needs: quality-gate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org/"

      - name: Install Dependencies
        working-directory: ./lorapok-player
        run: npm install

      - name: Build Library
        working-directory: ./lorapok-player/packages/lorapok-player
        run: npm run build

      - name: Publish to NPM
        if: env.NODE_AUTH_TOKEN != ''
        working-directory: ./lorapok-player/packages/lorapok-player
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-snap:
    name: Publish to Snap Store
    needs: build-desktop
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Snap Artifact
        uses: actions/download-artifact@v4
        with:
          name: Binaries-ubuntu-latest
          path: release

      - name: Resolve Snap Package
        id: snap_resolver
        run: |
          SNAP_PATH=$(find release -name "*.snap" -type f | head -n 1)
          echo "path=$SNAP_PATH" >> $GITHUB_OUTPUT

      - name: Publish to Snap Store
        if: env.SNAPCRAFT_STORE_CREDENTIALS != ''
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.snap_resolver.outputs.path }}
          release: stable
