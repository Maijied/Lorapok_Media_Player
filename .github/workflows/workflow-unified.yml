name: Lorapok Enterprise CI/CD

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Security & Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Dependencies
        working-directory: lorapok-player
        run: npm install

      - name: Typecheck
        working-directory: lorapok-player
        run: npm run typecheck

  build-extensions:
    name: Build Browser Extensions (Firefox AMO, Chrome, Edge)
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Package All Browser Extensions
        working-directory: lorapok-extension
        run: |
          sudo apt-get update && sudo apt-get install -y zip
          node build_extensions.js

      - name: Store Extension Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Binaries-Extensions
          path: |
            lorapok-player/release/builds/extensions/*.xpi
            lorapok-player/release/builds/extensions/*.zip

  build-vscode-extension:
    name: Build Visual Studio Code Extension (.vsix)
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Package VS Code Extension
        working-directory: packages/vscode-lorapok
        run: |
          sudo apt-get update && sudo apt-get install -y zip
          node build_extension.js

      - name: Store VS Code Extension Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Binaries-VSCode
          path: |
            lorapok-player/release/builds/extensions/*.vsix

  build-python-package:
    name: Build Python PIP Package (Wheel & Sdist)
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Build Tools
        run: pip install --upgrade setuptools wheel build

      - name: Build Python Package
        working-directory: packages/lorapok-python
        run: python -m build

      - name: Store Python Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Binaries-Python
          path: |
            packages/lorapok-python/dist/*.whl
            packages/lorapok-python/dist/*.tar.gz

  build-desktop:
    name: Build Desktop (${{ matrix.os }})
    needs: quality-gate
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Dependencies
        working-directory: lorapok-player
        run: npm install

      - name: Build Electron App
        working-directory: lorapok-player
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Store Binaries
        uses: actions/upload-artifact@v4
        with:
          name: Binaries-${{ matrix.os }}
          path: |
            lorapok-player/release/**/*.exe
            lorapok-player/release/**/*.dmg
            lorapok-player/release/**/*.AppImage
            lorapok-player/release/**/*.deb
            lorapok-player/release/**/*.snap
            lorapok-player/release/**/*.zip

  build-android:
    name: Build Android (Signed Release)
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Dependencies & Sync Android
        working-directory: lorapok-player
        run: |
          npm install
          npm run build:only
          npx cap sync android

      - name: Build Android Universal & Splits APK + Bundle
        working-directory: lorapok-player/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease

      - name: Store Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Binaries-android
          path: |
            lorapok-player/android/app/build/outputs/apk/release/*.apk
            lorapok-player/android/app/build/outputs/bundle/release/*.aab

  release-rolling:
    name: Aggregate & Publish Rolling Release
    needs: [build-desktop, build-android, build-extensions, build-vscode-extension, build-python-package]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all built binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display Downloaded Files
        run: ls -R artifacts/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          name: ${{ github.ref_type == 'tag' && format('Lorapok Player {0}', github.ref_name) || 'Lorapok Player (Latest Build)' }}
          body: |
            ## Lorapok Media Player v1.5.0
            
            ${{ github.ref_type == 'tag' && format('Official stable release {0}.', github.ref_name) || '🚀 Rolling release — latest build from main branch.' }}
            
            ### Downloads & Packages
            | Platform | File Format / Target |
            |----------|----------------------|
            | 🪟 Windows | `LorapokMediaPlayer-Windows-Setup.exe` (Setup & Portable) |
            | 🍎 macOS | `Lorapok-Media-Player-1.5.0-arm64.dmg` / Intel DMG / Portable ZIP |
            | 🐧 Linux | `LorapokMediaPlayer-Linux.AppImage` (Portable) / `.deb` (Installable) |
            | 🤖 Android | Universal APK / ARM64 APK / Google Play AAB |
            | 🦊 Firefox AMO | `lorapok-extension-firefox-1.5.0.xpi` (Installable) / `.zip` |
            | 🌐 Chrome / Edge | `lorapok-extension-chrome-1.5.0.zip` / `lorapok-extension-edge-1.5.0.zip` |
            | 💻 VS Code | `lorapok-player-vscode-1.5.0.vsix` Extension |
            | 🐍 Python PIP | `lorapok-1.5.0-py3-none-any.whl` / `lorapok-1.5.0.tar.gz` |
            
            Website: https://media.lorapok.tech
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.snap
            artifacts/**/*.zip
            artifacts/**/*.apk
            artifacts/**/*.aab
            artifacts/**/*.xpi
            artifacts/**/*.vsix
            artifacts/**/*.whl
            artifacts/**/*.tar.gz
          make_latest: ${{ github.ref_type == 'tag' && 'true' || 'false' }}
          prerelease: ${{ github.ref_type != 'tag' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-site:
    name: Build & Deploy Website
    needs: release-rolling
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        working-directory: lorapok-player
        run: npm install

      - name: Build Library
        working-directory: lorapok-player/packages/lorapok-player
        run: npm run build

      - name: Package Extensions for Website
        working-directory: lorapok-extension
        run: |
          sudo apt-get update && sudo apt-get install -y zip
          node build_extensions.js

      - name: Package VS Code Extension for Website
        working-directory: packages/vscode-lorapok
        run: node build_extension.js

      - name: Package Python SDK for Website
        working-directory: packages/lorapok-python
        run: |
          pip install --upgrade setuptools wheel
          python setup.py sdist bdist_wheel

      - name: Generate Demos & Build Website
        working-directory: lorapok-player/packages/website
        run: |
          sudo apt-get install -y ffmpeg
          node scripts/sync_downloads.js
          npm run build

      - name: Ensure Custom Domain CNAME
        working-directory: lorapok-player/packages/website
        run: |
          echo "media.lorapok.tech" > dist/CNAME

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './lorapok-player/packages/website/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  publish-package:
    name: Publish to NPM
    needs: quality-gate
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org/"

      - name: Install Dependencies
        working-directory: ./lorapok-player
        run: npm install

      - name: Build Library
        working-directory: ./lorapok-player/packages/lorapok-player
        run: npm run build

      - name: Publish to NPM
        working-directory: ./lorapok-player/packages/lorapok-player
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "📦 Publishing lorapok-player to npmjs.org..."
            npm publish --access public || echo "⚠️ NPM publish returned status code. (May already be published for this version)"
          else
            echo "⚠️ NPM_TOKEN secret not configured in repository. Skipping NPM publish step."
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-firefox-amo:
    name: Publish to Mozilla Add-ons (AMO)
    needs: build-extensions
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install web-ext
        run: npm install -g web-ext

      - name: Sign & Submit to AMO
        run: |
          if [ -n "$AMO_JWT_ISSUER" ] && [ -n "$AMO_JWT_SECRET" ]; then
            echo "🦊 Submitting Firefox Extension to Mozilla Add-ons (AMO)..."
            cd lorapok-extension
            web-ext sign --api-key="$AMO_JWT_ISSUER" --api-secret="$AMO_JWT_SECRET" --source-dir=. --artifacts-dir=../amo-artifacts --channel=listed || echo "⚠️ AMO submission notice."
          else
            echo "ℹ️ AMO_JWT_ISSUER / AMO_JWT_SECRET not configured. The AMO-ready package 'lorapok-extension-firefox-1.5.0.xpi' has been packaged and published to GitHub Releases for manual or API upload."
          fi
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER || secrets.AMO_API_KEY }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET || secrets.AMO_API_SECRET }}

  publish-snap:
    name: Publish to Snap Store
    needs: build-desktop
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Snap Artifact
        uses: actions/download-artifact@v4
        with:
          name: Binaries-ubuntu-latest
          path: release

      - name: Publish to Snap Store
        run: |
          SNAP_PATH=$(find release -name "*.snap" -type f | head -n 1)
          if [ -n "$SNAP_PATH" ] && [ -n "$SNAPCRAFT_STORE_CREDENTIALS" ]; then
            echo "📦 Publishing $SNAP_PATH to Snap Store..."
            sudo snap install snapcraft --classic
            snapcraft login --with <(echo "$SNAPCRAFT_STORE_CREDENTIALS")
            snapcraft upload --release=stable "$SNAP_PATH"
          else
            echo "ℹ️ Snap package or SNAPCRAFT_STORE_CREDENTIALS secret not set. The Linux AppImage & Debian (.deb) packages are published to GitHub Releases."
          fi
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
