name: Release Publisher

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release Assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'lorapok-player/package-lock.json'

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: |
          npm ci --prefix lorapok-player
          npm ci --prefix lorapok-extension

      - name: Build Core Library & Web
        run: |
          npm --prefix lorapok-player/packages/lorapok-player run build
          npm --prefix lorapok-player/packages/website run build

      - name: Package VS Code Extension (.vsix)
        run: |
          npx --yes @vscode/vsce package --no-dependencies --out lorapok-player-vscode-${GITHUB_REF_NAME#v}.vsix --cwd packages/vscode-lorapok || true

      - name: Package Browser Extensions
        run: |
          npm --prefix lorapok-extension run build
          zip -r lorapok-extension-chrome-${GITHUB_REF_NAME#v}.zip lorapok-extension/dist
          zip -r lorapok-extension-edge-${GITHUB_REF_NAME#v}.zip lorapok-extension/dist
          zip -r lorapok-extension-firefox-${GITHUB_REF_NAME#v}.zip lorapok-extension/dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Lorapok Media Player ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            lorapok-player/release/builds/android/*.apk
            lorapok-player/release/builds/android/*.aab
            lorapok-player/release/builds/linux/*.AppImage
            lorapok-player/release/builds/linux/*.deb
            lorapok-player/release/builds/windows/*.exe
            *.vsix
            *.zip
            *.xpi
