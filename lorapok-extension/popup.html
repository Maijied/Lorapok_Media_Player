<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lorapok Connector</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #030712;
      color: #f3f4f6;
      padding: 16px;
      overflow-x: hidden;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 12px;
      margin-bottom: 14px;
    }
    .logo-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.4);
    }
    .logo-title {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, #00f0ff, #bc13fe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .badge {
      font-size: 10px;
      font-weight: 700;
      font-family: monospace;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(0, 240, 255, 0.1);
      color: #00f0ff;
      border: 1px solid rgba(0, 240, 255, 0.2);
    }
    .section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #9ca3af;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .media-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 12px;
    }
    .media-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 8px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 6px;
      margin-bottom: 6px;
    }
    .media-url {
      font-size: 11px;
      font-family: monospace;
      color: #00f0ff;
      word-break: break-all;
      max-height: 38px;
      overflow: hidden;
    }
    .media-actions {
      display: flex;
      gap: 6px;
      margin-top: 4px;
    }
    .btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
      text-decoration: none;
    }
    .btn-primary {
      background: linear-gradient(135deg, #00f0ff, #0284c7);
      color: #030712;
    }
    .btn-primary:hover {
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.4);
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #f3f4f6;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.15);
    }
    .btn-launch {
      width: 100%;
      padding: 10px;
      font-size: 12px;
      margin-top: 8px;
      background: linear-gradient(135deg, #bc13fe, #7928ca);
      color: #ffffff;
      box-shadow: 0 0 15px rgba(188, 19, 254, 0.3);
    }
    .btn-launch:hover {
      box-shadow: 0 0 20px rgba(188, 19, 254, 0.6);
      transform: translateY(-1px);
    }
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 10px;
      color: #6b7280;
    }
    .footer a {
      color: #00f0ff;
      text-decoration: none;
    }
    .empty-state {
      text-align: center;
      padding: 14px;
      font-size: 11px;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-container">
      <img src="icon128.png" alt="Lorapok" class="logo-icon">
      <span class="logo-title">LORAPOK CONNECTOR</span>
    </div>
    <span class="badge">v2.0.0</span>
  </div>

  <div class="section-title">
    <span>Detected Media on Page</span>
    <button id="btn-refresh" class="badge" style="cursor: pointer;">SCAN</button>
  </div>

  <div id="media-list" class="media-card">
    <div class="empty-state">Scanning active page for video & audio streams...</div>
  </div>

  <div class="section-title">Quick Actions</div>
  <a href="https://media.lorapok.tech" target="_blank" class="btn btn-launch">
    🌐 Open Web Player (media.lorapok.tech)
  </a>

  <div class="footer">
    <span>Lorapok Media Ecosystem</span>
    <a href="https://media.lorapok.tech" target="_blank">media.lorapok.tech</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
